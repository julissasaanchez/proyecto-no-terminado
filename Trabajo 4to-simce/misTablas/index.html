<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Leyenda de los Héroes Matemáticos 🗺️ - Selección de Héroe</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="Sistema/IMAGEN/logo.svg">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="Sistema/CSS/variables.css">
    <link rel="stylesheet" href="Sistema/CSS/login.css">
    <link rel="stylesheet" href="Sistema/CSS/modales.css">
    <link rel="stylesheet" href="Sistema/CSS/efectos.css">
</head>
<body>
    <div class="login-container">
        <!-- Formas místicas de fondo -->
        <div class="bg-shape bg-shape-1"></div>
        <div class="bg-shape bg-shape-2"></div>

        <main class="login-card" style="max-width: 820px;">
            <!-- Header Marca & Logo de Aventura -->
            <header class="brand-header">
                <div class="brand-logo anim-float">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                </div>
                <h1 class="brand-title">La Leyenda de los Héroes Matemáticos ⚔️</h1>
                <p class="brand-subtitle">✨ ¡Elige a tu personaje héroe y explora los 5 Mundos Mágicos! 🗺️</p>
            </header>

            <!-- Formulario de Selección del Héroe -->
            <form id="loginForm" onsubmit="return false;">
                <!-- Campo Nombre -->
                <div class="form-group">
                    <label for="studentNameInput" class="form-label">
                        <span>✏️</span> Escribe el nombre de tu Héroe Explorador:
                    </label>
                    <input 
                        type="text" 
                        id="studentNameInput" 
                        class="input-field" 
                        placeholder="Ej. Sofía, Mateo, Lucas..." 
                        maxlength="25"
                        autocomplete="off"
                        required
                    >
                </div>

                <!-- Selección de Avatar Héroe -->
                <div class="form-group">
                    <label class="form-label">
                        <span>🦸‍♂️</span> Elige a tu Compañero Héroe de Aventura:
                    </label>
                    <div class="avatar-grid" id="avatarGrid" style="grid-template-columns: repeat(4, 1fr); gap: 16px;">
                        <!-- Avatares Héroe SVG inyectados por login.js -->
                    </div>
                </div>

                <!-- Botón de Inicio de la Aventura -->
                <button type="button" id="btnEnter" class="btn-submit anim-pulse" style="margin-top:25px;">
                    <span>¡COMENZAR LA AVENTURA!</span> 🚀
                </button>
            </form>
        </main>
    </div>

    <!-- Scripts JS -->
    <script src="Sistema/JS/audio.js"></script>
    <script src="Sistema/JS/state.js"></script>
    <script src="Sistema/JS/modal-sys.js"></script>
    <script src="Sistema/JS/bg-effects.js"></script>
    <script src="Sistema/JS/login.js"></script>
</body>
</html>
